<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1626" />
      <stop offset="50%" stop-color="#0F243E" />
      <stop offset="100%" stop-color="#081422" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B5E75" />
      <stop offset="50%" stop-color="#2D3C4F" />
      <stop offset="100%" stop-color="#1B2735" />
    </linearGradient>
    <linearGradient id="burnerFlames" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="40%" stop-color="#00D2FF" />
      <stop offset="80%" stop-color="#70E5FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="ignitorGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="30%" stop-color="#FF5A1F" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="hotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#FF3D00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF3D00" stop-opacity="0" />
    </radialGradient>
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="380" fill="url(#bgGrad)" />
  <rect width="600" height="380" fill="url(#gridPattern)" />

  <!-- Outer Technical Bezel -->
  <rect x="12" y="12" width="576" height="356" rx="8" fill="none" stroke="#1E3A5F" stroke-width="1.5" />
  <circle cx="20" cy="20" r="3" fill="#3B82F6" opacity="0.6" />
  <circle cx="580" cy="20" r="3" fill="#3B82F6" opacity="0.6" />
  <circle cx="20" cy="360" r="3" fill="#3B82F6" opacity="0.6" />
  <circle cx="580" cy="360" r="3" fill="#3B82F6" opacity="0.6" />

  <!-- Component Graphic Body -->
  
  <!-- Inducer Fan Motor Housing & Flue Vent Pipe -->
  <rect x="80" y="120" width="160" height="140" rx="12" fill="#1E293B" stroke="#64748B" stroke-width="2" />
  <circle cx="160" cy="190" r="45" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
  <!-- Inducer Exhaust Pipe Upward -->
  <rect x="190" y="90" width="40" height="40" rx="2" fill="#475569" stroke="#94A3B8" stroke-width="1.5" />
  <path d="M 210 110 L 210 80 M 202 92 L 210 80 L 218 92" fill="none" stroke="#38BDF8" stroke-width="2.5" />

  <!-- Vacuum Pressure Switch (Round Diaphragm) -->
  <circle cx="400" cy="180" r="50" fill="#334155" stroke="#F59E0B" stroke-width="2.5" />
  <circle cx="400" cy="180" r="28" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5" />
  <text x="400" y="185" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">DRAFT SWITCH</text>

  <!-- Clear Silicone Vacuum Sensing Tubing -->
  <path d="M 205 180 C 270 180, 290 180, 350 180" fill="none" stroke="#67E8F9" stroke-width="6" stroke-dasharray="10 4" />

  <!-- Manometer Draft Pressure Metric -->
  <g transform="translate(150, 275)">
    <rect width="300" height="42" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
    <text x="14" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FDE68A">DRAFT: -0.18" W.C. (SWITCH RATED: -0.65")</text>
  </g>
  

  <!-- Header Banner HUD -->
  <rect x="24" y="24" width="552" height="42" rx="6" fill="rgba(8, 20, 36, 0.85)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <text x="40" y="50" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">DIAGNOSTIC: DRAFT INDUCER & VACUUM PRESSURE SWITCH</text>
  
  <!-- Right Status Badge -->
  <rect x="420" y="32" width="144" height="26" rx="4" fill="#D97706" />
  <text x="492" y="49" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">DRAFT FAILURE</text>
</svg>