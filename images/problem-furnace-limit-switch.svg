<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1626" />
      <stop offset="50%" stop-color="#0F243E" />
      <stop offset="100%" stop-color="#081422" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B5E75" />
      <stop offset="50%" stop-color="#2D3C4F" />
      <stop offset="100%" stop-color="#1B2735" />
    </linearGradient>
    <linearGradient id="burnerFlames" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="40%" stop-color="#00D2FF" />
      <stop offset="80%" stop-color="#70E5FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="ignitorGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="30%" stop-color="#FF5A1F" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="hotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#FF3D00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF3D00" stop-opacity="0" />
    </radialGradient>
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="380" fill="url(#bgGrad)" />
  <rect width="600" height="380" fill="url(#gridPattern)" />

  <!-- Outer Technical Bezel -->
  <rect x="12" y="12" width="576" height="356" rx="8" fill="none" stroke="#1E3A5F" stroke-width="1.5" />
  <circle cx="20" cy="20" r="3" fill="#3B82F6" opacity="0.6" />
  <circle cx="580" cy="20" r="3" fill="#3B82F6" opacity="0.6" />
  <circle cx="20" cy="360" r="3" fill="#3B82F6" opacity="0.6" />
  <circle cx="580" cy="360" r="3" fill="#3B82F6" opacity="0.6" />

  <!-- Component Graphic Body -->
  
  <!-- Heat Chamber Plenum Casing -->
  <rect x="70" y="110" width="460" height="190" rx="10" fill="#1C1F2E" stroke="#374151" stroke-width="1.5" />
  
  <!-- High Temperature Thermal Wave Aura -->
  <rect x="90" y="130" width="300" height="150" rx="8" fill="url(#hotGlow)" opacity="0.35" />

  <!-- Limit Switch Mounting Plate & Bi-metal Sensor Stem -->
  <rect x="360" y="140" width="130" height="110" rx="8" fill="#1E293B" stroke="#F87171" stroke-width="2" />
  <rect x="340" y="175" width="20" height="40" rx="3" fill="#CBD5E1" />
  
  <!-- Internal Bi-Metal Contact Open Circuit -->
  <circle cx="425" cy="195" r="24" fill="#0F172A" stroke="#EF4444" stroke-width="2" />
  <path d="M 412 195 L 422 195 L 436 182" fill="none" stroke="#F87171" stroke-width="3" stroke-linecap="round" />
  <circle cx="438" cy="195" r="3" fill="#F87171" />
  <text x="425" y="235" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#F87171" text-anchor="middle">CONTACT: OPEN</text>

  <!-- Temperature Metric Indicator -->
  <g transform="translate(150, 275)">
    <rect width="300" height="42" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1.5" />
    <text x="14" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FCA5A5">PLENUM TEMP: 228&deg;F (LIMIT TRIP &gt; 200&deg;F)</text>
  </g>
  

  <!-- Header Banner HUD -->
  <rect x="24" y="24" width="552" height="42" rx="6" fill="rgba(8, 20, 36, 0.85)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <text x="40" y="50" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">DIAGNOSTIC: PRIMARY HIGH-LIMIT THERMAL SWITCH</text>
  
  <!-- Right Status Badge -->
  <rect x="420" y="32" width="144" height="26" rx="4" fill="#DC2626" />
  <text x="492" y="49" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">OVERHEATING</text>
</svg>