<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="heatBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>
    <linearGradient id="heatStripGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F1D1D" />
      <stop offset="35%" stop-color="#EA580C" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>
    <radialGradient id="thermalRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#EA580C" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />
    </radialGradient>
    <filter id="heatGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="heatGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="600" height="380" fill="url(#heatBgGrad)" />
  <rect width="600" height="380" fill="url(#heatGrid)" />

  <rect x="12" y="12" width="576" height="356" rx="8" fill="none" stroke="#2563EB" stroke-width="1.2" opacity="0.4" />
  <circle cx="20" cy="20" r="3" fill="#60A5FA" opacity="0.6" />
  <circle cx="580" cy="20" r="3" fill="#60A5FA" opacity="0.6" />
  <circle cx="20" cy="360" r="3" fill="#60A5FA" opacity="0.6" />
  <circle cx="580" cy="360" r="3" fill="#60A5FA" opacity="0.6" />

  
  <rect x="70" y="110" width="460" height="190" rx="10" fill="#131E33" stroke="#EF4444" stroke-width="1.5" />
  <circle cx="200" cy="195" r="50" fill="url(#thermalRadial)" />
  <circle cx="200" cy="195" r="30" fill="#1E293B" stroke="#F87171" stroke-width="2.5" />
  <text x="200" y="200" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#FCA5A5" text-anchor="middle">LIMIT TRIP</text>

  <g transform="translate(280, 150)">
    <rect width="210" height="85" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1.5" />
    <text x="14" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#F87171">CYCLE DURATION: 2.4 MIN</text>
    <text x="14" y="48" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#94A3B8">High limit cut-off tripped</text>
    <text x="14" y="70" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FBBF24">Air filter / blower CFM low</text>
  </g>

  <g transform="translate(150, 265)">
    <rect width="300" height="42" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1.5" />
    <text x="14" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FCA5A5">STATUS: Short-cycling on thermal overload</text>
  </g>
  

  <rect x="24" y="24" width="552" height="42" rx="6" fill="rgba(11, 19, 43, 0.9)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <text x="40" y="50" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">DIAGNOSTIC: HIGH-LIMIT SAFETY SWITCH & SHORT CYCLING</text>
  
  <rect x="420" y="32" width="144" height="26" rx="4" fill="#DC2626" />
  <text x="492" y="49" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">RAPID SHUTDOWN</text>
</svg>