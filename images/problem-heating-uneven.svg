<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="heatBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>
    <linearGradient id="heatStripGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F1D1D" />
      <stop offset="35%" stop-color="#EA580C" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>
    <radialGradient id="thermalRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#EA580C" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />
    </radialGradient>
    <filter id="heatGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="heatGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="600" height="380" fill="url(#heatBgGrad)" />
  <rect width="600" height="380" fill="url(#heatGrid)" />

  <rect x="12" y="12" width="576" height="356" rx="8" fill="none" stroke="#2563EB" stroke-width="1.2" opacity="0.4" />
  <circle cx="20" cy="20" r="3" fill="#60A5FA" opacity="0.6" />
  <circle cx="580" cy="20" r="3" fill="#60A5FA" opacity="0.6" />
  <circle cx="20" cy="360" r="3" fill="#60A5FA" opacity="0.6" />
  <circle cx="580" cy="360" r="3" fill="#60A5FA" opacity="0.6" />

  
  <rect x="70" y="110" width="460" height="190" rx="10" fill="#131E33" stroke="#475569" stroke-width="1.5" />
  <!-- Supply Duct Plenum Trunk -->
  <rect x="100" y="150" width="160" height="70" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="2" />
  <text x="180" y="190" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#CBD5E1" text-anchor="middle">MAIN TRUNK</text>

  <!-- Zone 1 Branch (Warm) -->
  <path d="M 260 170 L 360 140" fill="none" stroke="#FF5A1F" stroke-width="6" />
  <text x="380" y="145" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FF7A00">ZONE 1: 74&deg;F (650 CFM)</text>

  <!-- Zone 2 Branch (Cold / Restricted) -->
  <path d="M 260 200 L 360 230" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 4" />
  <text x="380" y="235" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#93C5FD">ZONE 2: 63&deg;F (RESTRICTED)</text>

  <g transform="translate(150, 265)">
    <rect width="300" height="42" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
    <text x="14" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FDE68A">STATIC PRESSURE: 0.82" W.C. (HIGH FRICTION)</text>
  </g>
  

  <rect x="24" y="24" width="552" height="42" rx="6" fill="rgba(11, 19, 43, 0.9)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <text x="40" y="50" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">DIAGNOSTIC: AIR DISTRIBUTION & DUCTWORK DAMPERS</text>
  
  <rect x="420" y="32" width="144" height="26" rx="4" fill="#D97706" />
  <text x="492" y="49" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">UNEVEN COMFORT</text>
</svg>