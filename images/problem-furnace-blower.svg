<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1626" />
      <stop offset="50%" stop-color="#0F243E" />
      <stop offset="100%" stop-color="#081422" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B5E75" />
      <stop offset="50%" stop-color="#2D3C4F" />
      <stop offset="100%" stop-color="#1B2735" />
    </linearGradient>
    <linearGradient id="burnerFlames" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="40%" stop-color="#00D2FF" />
      <stop offset="80%" stop-color="#70E5FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="ignitorGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="30%" stop-color="#FF5A1F" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="hotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#FF3D00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF3D00" stop-opacity="0" />
    </radialGradient>
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="380" fill="url(#bgGrad)" />
  <rect width="600" height="380" fill="url(#gridPattern)" />

  <!-- Outer Technical Bezel -->
  <rect x="12" y="12" width="576" height="356" rx="8" fill="none" stroke="#1E3A5F" stroke-width="1.5" />
  <circle cx="20" cy="20" r="3" fill="#3B82F6" opacity="0.6" />
  <circle cx="580" cy="20" r="3" fill="#3B82F6" opacity="0.6" />
  <circle cx="20" cy="360" r="3" fill="#3B82F6" opacity="0.6" />
  <circle cx="580" cy="360" r="3" fill="#3B82F6" opacity="0.6" />

  <!-- Component Graphic Body -->
  
  <!-- Lower Cabinet Blower Compartment -->
  <rect x="70" y="110" width="460" height="190" rx="10" fill="#111E2E" stroke="#1E3A5F" stroke-width="1.5" />
  
  <!-- Centrifugal Squirrel Cage Fan Housing -->
  <circle cx="230" cy="205" r="70" fill="#1E293B" stroke="#475569" stroke-width="3" />
  <circle cx="230" cy="205" r="42" fill="#0F172A" stroke="#64748B" stroke-width="2" />
  <!-- Fan Blades Radiating -->
  <line x1="230" y1="135" x2="230" y2="163" stroke="#94A3B8" stroke-width="3" />
  <line x1="230" y1="247" x2="230" y2="275" stroke="#94A3B8" stroke-width="3" />
  <line x1="160" y1="205" x2="188" y2="205" stroke="#94A3B8" stroke-width="3" />
  <line x1="272" y1="205" x2="300" y2="205" stroke="#94A3B8" stroke-width="3" />
  <line x1="180" y1="155" x2="200" y2="175" stroke="#94A3B8" stroke-width="3" />
  <line x1="260" y1="235" x2="280" y2="255" stroke="#94A3B8" stroke-width="3" />

  <!-- ECM Electronic Motor & Capacitor -->
  <rect x="330" y="155" width="110" height="90" rx="8" fill="#334155" stroke="#60A5FA" stroke-width="2" />
  <rect x="400" y="130" width="30" height="45" rx="5" fill="#475569" stroke="#94A3B8" stroke-width="1.5" />
  <text x="385" y="205" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">ECM MOTOR</text>

  <!-- Cold Air Flow Arrows (Blue) -->
  <path d="M 460 170 L 510 170 M 495 160 L 510 170 L 495 180" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <path d="M 460 210 L 510 210 M 495 200 L 510 210 L 495 220" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />

  <!-- Airflow Diagnostic Readout -->
  <g transform="translate(160, 275)">
    <rect width="280" height="42" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" />
    <text x="14" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#60A5FA">BLOWER RUNNING / BURNERS OFF (NO HEAT)</text>
  </g>
  

  <!-- Header Banner HUD -->
  <rect x="24" y="24" width="552" height="42" rx="6" fill="rgba(8, 20, 36, 0.85)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <text x="40" y="50" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">DIAGNOSTIC: ECM BLOWER MOTOR & CIRCULATION FAN</text>
  
  <!-- Right Status Badge -->
  <rect x="420" y="32" width="144" height="26" rx="4" fill="#2563EB" />
  <text x="492" y="49" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">COLD AIR BLOWING</text>
</svg>