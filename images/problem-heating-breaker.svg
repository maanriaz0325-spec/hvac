<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="heatBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>
    <linearGradient id="heatStripGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F1D1D" />
      <stop offset="35%" stop-color="#EA580C" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>
    <radialGradient id="thermalRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#EA580C" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />
    </radialGradient>
    <filter id="heatGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="heatGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="600" height="380" fill="url(#heatBgGrad)" />
  <rect width="600" height="380" fill="url(#heatGrid)" />

  <rect x="12" y="12" width="576" height="356" rx="8" fill="none" stroke="#2563EB" stroke-width="1.2" opacity="0.4" />
  <circle cx="20" cy="20" r="3" fill="#60A5FA" opacity="0.6" />
  <circle cx="580" cy="20" r="3" fill="#60A5FA" opacity="0.6" />
  <circle cx="20" cy="360" r="3" fill="#60A5FA" opacity="0.6" />
  <circle cx="580" cy="360" r="3" fill="#60A5FA" opacity="0.6" />

  
  <rect x="70" y="110" width="460" height="190" rx="10" fill="#131E33" stroke="#DC2626" stroke-width="1.5" />
  <!-- Double-Pole 60A HVAC Breaker -->
  <rect x="110" y="140" width="100" height="110" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="2" />
  <!-- Tripped Toggle in Center Position -->
  <rect x="140" y="185" width="40" height="20" rx="3" fill="#F87171" stroke="#EF4444" />
  <text x="160" y="198" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">TRIP</text>
  <text x="160" y="165" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#CBD5E1" text-anchor="middle">60 AMP</text>

  <!-- Amp Clamp Meter Reading -->
  <g transform="translate(250, 140)">
    <rect width="240" height="100" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1.5" />
    <text x="16" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#EF4444">LOAD: 68.4 AMPS (OVERLOAD)</text>
    <text x="16" y="55" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Breaker trips after 12 seconds</text>
    <text x="16" y="78" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FBBF24">Grounded 10kW heating coil</text>
  </g>

  <g transform="translate(150, 265)">
    <rect width="300" height="42" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1.5" />
    <text x="14" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FCA5A5">MEGOHMMETER: 0.1 M&Omega; to chassis ground</text>
  </g>
  

  <rect x="24" y="24" width="552" height="42" rx="6" fill="rgba(11, 19, 43, 0.9)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <text x="40" y="50" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">DIAGNOSTIC: CIRCUIT BREAKER OVERLOAD & GROUND FAULT</text>
  
  <rect x="420" y="32" width="144" height="26" rx="4" fill="#DC2626" />
  <text x="492" y="49" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">BREAKER TRIP</text>
</svg>